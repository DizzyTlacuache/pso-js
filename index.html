<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Swarm Optimization</title>
    <style> 
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: 20px;
            font-family: sans-serif;
        }
        h1 {
            margin-bottom: 10px;
        }
        canvas {
            margin-top: 20px;
            border: 1px solid #ccc;
        }
        .controls {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Particle Swarm Optimization</h1>
    <p>A code experiment by <a href="https://www.adamstirtan.com">Adam Stirtan</a>.</p>
    <canvas id="demo-canvas" width="500" height="500"></canvas>
    <div class="controls">
        <label for="inertia">Inertia:</label>
        <input type="range" id="inertia" min="0" max="1" step="0.01" value="0.5">
        <label for="c1">Cognitive:</label>
        <input type="range" id="c1" min="0" max="2" step="0.01" value="1.6">
        <label for="c2">Social:</label>
        <input type="range" id="c2" min="0" max="2" step="0.01" value="1.6">
    </div>
    <script>
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.velocityX = Math.random() * 2 - 1;
                this.velocityY = Math.random() * 2 - 1;
                this.pBestX = x;
                this.pBestY = y;
                this.maxVelocity = 1.0;
            }

            updateVelocity(inertia, c1, c2, gBestX, gBestY) {
                const r1 = Math.random();
                const r2 = Math.random();

                this.velocityX = inertia * this.velocityX +
                    c1 * r1 * (this.pBestX - this.x) +
                    c2 * r2 * (gBestX - this.x);

                this.velocityY = inertia * this.velocityY +
                    c1 * r1 * (this.pBestY - this.y) +
                    c2 * r2 * (gBestY - this.y);

                this.velocityX = Math.max(Math.min(this.velocityX, this.maxVelocity), -this.maxVelocity);
                this.velocityY = Math.max(Math.min(this.velocityY, this.maxVelocity), -this.maxVelocity);

                this.x += this.velocityX;
                this.y += this.velocityY;
            }

            updatePosition() {
                this.x += this.velocityX;
                this.y += this.velocityY;
            }

            evaluateFitness(fitnessFunction) {
                const fitness = fitnessFunction(this.x, this.y);
                if (fitness < fitnessFunction(this.pBestX, this.pBestY)) {
                    this.pBestX = this.x;
                    this.pBestY = this.y;
                }
            }

            draw(context) {
                context.beginPath();
                context.arc(this.x, this.y, 5, 0, 2 * Math.PI);
                context.fillStyle = 'blue';
                context.fill();
                context.stroke();
            }
        }

        class Swarm {
            constructor(numParticles) {
                this.particles = Array.from({ length: numParticles }, () => new Particle(Math.random() * 500, Math.random() * 500));
                this.globalBest = { x: this.particles[0].x, y: this.particles[0].y };
            }

            updateGlobalBest() {
                this.particles.forEach(particle => {
                    const currentFitness = fitnessFunction(particle.x, particle.y);
                    const gBestFitness = fitnessFunction(this.globalBest.x, this.globalBest.y);

                    if (currentFitness < gBestFitness) {
                        this.globalBest.x = particle.x;
                        this.globalBest.y = particle.y;
                    }
                });
            }

            updateObjective(objectiveX, objectiveY) {
                this.particles.forEach(particle => {
                    particle.objectiveX = objectiveX;
                    particle.objectiveY = objectiveY;
                });
            }

            updateParticles(inertia, c1, c2, fitnessFunction) {
                this.particles.forEach(particle => {
                    particle.updateVelocity(inertia, c1, c2, this.globalBest.x, this.globalBest.y);
                    particle.updatePosition();
                    particle.evaluateFitness(fitnessFunction);
                });

                this.updateGlobalBest(fitnessFunction);
            }

            drawParticles(context) {
                this.particles.forEach(particle => {
                    particle.draw(context);
                });
            }
        }

        let mouseX = 250; // Default to center of canvas
        let mouseY = 250; // Default to center of canvas

        function fitnessFunction(x, y) {
            return Math.sqrt((x - mouseX) * (x - mouseX) + (y - mouseY) * (y - mouseY));
        }

        const canvas = document.getElementById('demo-canvas');
        const context = canvas.getContext('2d');
        const swarm = new Swarm(30);

        canvas.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = event.clientX - rect.left;
            mouseY = event.clientY - rect.top;
        });

        function psoStep() {
            const inertia = parseFloat(document.getElementById('inertia').value);
            const c1 = parseFloat(document.getElementById('c1').value);
            const c2 = parseFloat(document.getElementById('c2').value);

            context.clearRect(0, 0, canvas.width, canvas.height);
            swarm.updateParticles(inertia, c1, c2, fitnessFunction);
            swarm.drawParticles(context);

            requestAnimationFrame(psoStep);
        }

        psoStep();
    </script>
</body>
</html>
